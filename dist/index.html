	<meta charset="utf-8" />

<body>
<!-- === Reconstruction Status Overlay (only addition) === -->
<div id="progressOverlay" style="
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background: rgba(0,0,0,0.75);
		display: flex;
		justify-content: center;
		align-items: center;
		z-index: 9999;
	">
	<div style="
			background: #ffffff;
			padding: 20px 30px;
			border-radius: 10px;
			text-align: center;
			width: 280px;
			font-family: sans-serif;
		">
		<h2 style="margin-bottom: 10px; font-size: 20px;">Reconstructing Model</h2>

		<div style="
				width: 100%;
				height: 10px;
				background: #ddd;
				border-radius: 5px;
				overflow: hidden;
				margin-bottom: 10px;
			">
			<div id="progressContainer">
				<div id="progressBar"></div>
			</div>
		</div>

		<p id="progressText" style="font-size: 14px; margin: 0;">
			Waiting...
		</p>
	</div>
</div>
<!-- === End Overlay === -->

	<header>
		<h1><a href="/">glTF Viewer</a></h1>
	</header>
	<main class="wrap">
		<div class="dropzone">
			<div class="placeholder">
				
			</div>
			<div class="url-button">
				
			</div>
			<div class="upload-btn">
				<input type="file" name="file-input[]" id="file-input" multiple="" />
				
			</div>
		</div>
		<div class="spinner"></div>
	</main>
</body>
